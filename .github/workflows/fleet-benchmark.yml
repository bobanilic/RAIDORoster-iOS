name: Fleet benchmark validation
on:
  pull_request:
    paths:
      - 'tools/fleet_benchmark.py'
      - 'tests/test_fleet_benchmark.py'
      - '.github/workflows/fleet-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate benchmark without live network access
        run: python -m unittest discover -s tests -p 'test_fleet_benchmark.py' -v
