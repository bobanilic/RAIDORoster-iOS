name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          cd RAIDORoster-Web2IPA
          chmod +x build-unsigned-ipa.sh
          ./build-unsigned-ipa.sh

      - name: Upload IPA
        id: upload_ipa
        uses: actions/upload-artifact@v4
        with:
          name: RAIDORoster-V2.11.4-unsigned-IPA
          path: RAIDORoster-Web2IPA/RAIDORoster-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Record build receipt
        if: success()
        run: |
          cat > .github/latest-build.txt <<EOF
          version=2.11.4
          build=17
          run_id=${{ github.run_id }}
          artifact_id=${{ steps.upload_ipa.outputs.artifact-id }}
          artifact_digest=${{ steps.upload_ipa.outputs.artifact-digest }}
          commit=${{ github.sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/latest-build.txt
          git commit -m "Build receipt 2.11.4 [skip ci]" || exit 0
          git push
