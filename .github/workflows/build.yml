name: RAIDO validation and unsigned IPA
on:
  workflow_dispatch:
  pull_request:
    paths: ['RAIDORoster-Web2IPA/**', 'tools/**', 'tests/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['RAIDORoster-Web2IPA/**', 'tools/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: raido-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read authoritative version
        id: version
        run: echo "version=$(python3 tools/version.py --field version)" >> "$GITHUB_OUTPUT"
      - name: Check, build and verify committed source
        run: bash tools/ci.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: RAIDO-${{ steps.version.outputs.version }}-IPA
          path: |
            RAIDORoster-Web2IPA/RAIDORoster-unsigned.ipa
            RAIDORoster-Web2IPA/artifact-verification.json
          if-no-files-found: error
          retention-days: 14
  simulator:
    needs: release
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RAIDO-${{ needs.release.outputs.version }}-IPA
          path: RAIDORoster-Web2IPA
      - name: Check approved themes and map gestures
        run: bash tools/ci.sh preview
      - name: Shut down simulator before runner cleanup
        if: always()
        run: xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAIDO-${{ needs.release.outputs.version }}-simulator
          path: |
            /tmp/raido-*.png
            /tmp/raido-*.log
            /tmp/raido-theme-size.json
          if-no-files-found: warn
          retention-days: 7
