name: RAIDO validation and unsigned IPA
on:
  workflow_dispatch:
  pull_request:
    paths: ['RAIDORoster-Web2IPA/**', 'tools/**', 'tests/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['RAIDORoster-Web2IPA/**', 'tools/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  # A wedged simulator cancellation must not serialize newer source builds.
  group: raido-login-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read authoritative version
        id: version
        run: echo "version=$(python3 tools/version.py --field version)" >> "$GITHUB_OUTPUT"
      - name: Check, build and verify committed source
        run: bash tools/ci.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: RAIDO-${{ steps.version.outputs.version }}-IPA
          path: |
            RAIDORoster-Web2IPA/RAIDORoster-unsigned.ipa
            RAIDORoster-Web2IPA/artifact-verification.json
          if-no-files-found: error
          retention-days: 14
  simulator:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        scenario: [four-sectors, login, responsiveness, today-return]
    # Use the validated ARM host for latency-sensitive UI/AX interactions.
    # Keep four sectors on Intel as cross-architecture coverage; test/toolchain
    # and execution/result bounds remain identical on both hosts.
    runs-on: ${{ matrix.scenario == 'four-sectors' && 'macos-15-intel' || 'macos-15' }}
    # Two bounded 15 min UI attempts (only one AX setup recovery), plus
    # build/boot, result inspection, simulator deletion and artifact upload.
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record simulator host and selected toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: RAIDO-${{ needs.release.outputs.version }}-IPA
          path: RAIDORoster-Web2IPA
      - name: Check production launch and tab responsiveness
        env:
          # Double the existing Today transition coverage without retries or
          # changing the selected-state, scrolling and cache assertions.
          TEST_RUNNER_RAIDO_UI_TRANSITION_CYCLES: '6'
        run: bash tools/ci.sh startup --startup-case ${{ matrix.scenario }}
      - name: Shut down simulator before runner cleanup
        if: always()
        timeout-minutes: 1
        run: xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAIDO-${{ needs.release.outputs.version }}-simulator-${{ matrix.scenario }}
          path: |
            /tmp/raido-*.png
            /tmp/raido-*.log
            /tmp/raido-theme-size.json
            /tmp/raido-startup-*.xcresult
          if-no-files-found: warn
          retention-days: 7
  native-tests:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test startup cache, login bridge and Today priorities
        run: bash tools/ci.sh native-tests
      - name: Shut down simulator before runner cleanup
        if: always()
        timeout-minutes: 1
        run: xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAIDO-native-tests
          path: |
            RAIDORoster-Web2IPA/build/NativeTests.xcresult
            /tmp/raido-native-*.log
          if-no-files-found: warn
          retention-days: 7
