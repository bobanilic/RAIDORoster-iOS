name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          cd RAIDORoster-Web2IPA
          chmod +x build-unsigned-ipa.sh
          ./build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RAIDORoster-V2.5-unsigned-IPA
          path: RAIDORoster-Web2IPA/RAIDORoster-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
