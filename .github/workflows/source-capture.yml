name: Capture verified 2.29.8 source
on:
  push:
    branches: [codex/source-foundation]
    paths: ['.github/workflows/source-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Replay legacy source generation once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('RAIDORoster-Web2IPA')
          text = (root / 'build-unsigned-ipa.sh').read_text()
          script = root / 'capture-sources.sh'
          script.write_text(text.split('bash "$ROOT/../tools/run_generated_checks.sh"')[0])
          subprocess.run(['bash', str(script)], check=True)
          script.unlink()
          PY
      - name: Bundle generated source, original icon and earnings reference
        run: |
          tar -czf source-2.29.8.tar.gz RAIDORoster-Web2IPA/RAIDORoster RAIDORoster-Web2IPA/RAIDORoster.xcodeproj RAIDORoster-Web2IPA/build/validation/legacy.json
          shasum -a 256 source-2.29.8.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source-2.29.8
          path: source-2.29.8.tar.gz
          if-no-files-found: error
