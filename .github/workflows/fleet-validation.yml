name: Fleet reliability validation
on:
  pull_request:
    paths:
      - 'RAIDORoster-Web2IPA/**'
      - 'tests/**'
      - 'tools/preview_announcement_reader.py'
      - '.github/workflows/fleet-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check timestamped sensor evidence and arrival gates
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/FlightSensorPolicy.swift tests/FlightSensorPolicyChecks.swift -o /tmp/flight-sensor-checks
          /tmp/flight-sensor-checks
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check bounded refresh, cancellation and indexed roster
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/FleetTrackingPolicy.swift RAIDORoster-Web2IPA/RAIDORoster/FleetRefreshPolicy.swift tests/FleetRefreshChecks.swift -o /tmp/fleet-refresh-checks
          /tmp/fleet-refresh-checks
      - name: Exercise timestamp, identity, rotation and inference policy
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/FleetTrackingPolicy.swift tests/FleetTrackingPolicyChecks.swift -o /tmp/fleet-policy-checks
          /tmp/fleet-policy-checks
      - name: Check offline catalogue and aircraft-specific announcements
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/AnnouncementModels.swift tests/AnnouncementChecks.swift -o /tmp/announcement-checks
          /tmp/announcement-checks RAIDORoster-Web2IPA/RAIDORoster/GetJetAnnouncements.json
      - name: Check monthly earnings, hours and payment records
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/EarningsModels.swift tests/EarningsChecks.swift -o /tmp/earnings-checks
          /tmp/earnings-checks
      - name: Check Pay Profile migration and contract revisions
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/EarningsModels.swift RAIDORoster-Web2IPA/RAIDORoster/PayProfileModels.swift tests/PayProfileChecks.swift -o /tmp/pay-profile-checks
          /tmp/pay-profile-checks
      - name: Check encrypted Documents storage and expiry policy
        run: |
          swiftc RAIDORoster-Web2IPA/RAIDORoster/CrewDocumentVault.swift tests/CrewDocumentChecks.swift -o /tmp/crew-document-checks
          /tmp/crew-document-checks
      - name: Build complete patched iOS app
        run: bash RAIDORoster-Web2IPA/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RAIDO-2.28.0-Ice-IPA
          path: RAIDORoster-Web2IPA/RAIDORoster-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Render Ice tabs in iPhone simulator
        run: python3 tools/preview_ice_tabs.py
      - name: Upload Ice screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAIDO-2.28.0-Ice-screenshots
          path: |
            /tmp/raido-ice-*.png
            /tmp/raido-ice-app-*.log
            /tmp/raido-ice-crash-*
          retention-days: 7
          if-no-files-found: error
