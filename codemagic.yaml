# Optional alternative runner: uses the same entry point as GitHub Actions.
workflows:
  raido-ios-unsigned:
    name: RAIDO validated unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: 16.4
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'codex/*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Check, build and verify committed source
        script: bash tools/ci.sh all
    artifacts:
      - RAIDORoster-Web2IPA/RAIDORoster-unsigned.ipa
      - RAIDORoster-Web2IPA/artifact-verification.json
