workflows:
  raido-ios-unsigned:
    name: RAIDO Roster unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 20
    working_directory: RAIDORoster-Web2IPA
    environment:
      xcode: 26.5
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build unsigned IPA
        script: |
          chmod +x build-unsigned-ipa.sh
          ./build-unsigned-ipa.sh
      - name: Package IPA for iPhone download
        script: |
          rm -f RAIDORoster-V2.18.2-unsigned.zip
          /usr/bin/zip -j RAIDORoster-V2.18.2-unsigned.zip RAIDORoster-unsigned.ipa
    artifacts:
      - RAIDORoster-unsigned.ipa
      - RAIDORoster-V2.18.2-unsigned.zip
